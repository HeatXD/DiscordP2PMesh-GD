name: Windows Build

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Discord Social SDK is proprietary and cannot be vendored in a public repo, so CI
      # pulls it from a private mirror. Set the SDK_REPO_TOKEN secret to enable this job.
      - name: Check SDK access
        id: sdk
        shell: bash
        env:
          SDK_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          if [ -z "$SDK_TOKEN" ]; then
            echo "SDK_REPO_TOKEN is not set, skipping build." >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Discord Social SDK
        if: steps.sdk.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: HeatXD/discord-social-sdk
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: .sdk

      - name: Unpack Discord Social SDK
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: unzip -q .sdk/discord_social_sdk.zip -d DiscordP2PMesh/thirdparty/discord_social_sdk

      # MSVC is driven through the default multi-config generator, matching how godot-cpp's own
      # CMake CI builds on Windows, so no vcvars setup is needed.
      - name: Configure
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: cmake -B build -A x64 -DGODOTCPP_TARGET=${{ matrix.target }}

      - name: Build
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: cmake --build build --config Release

      - name: Package
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          pkg_dir="package/windows"
          mkdir -p "$pkg_dir/bin"
          cp bin/*.dll "$pkg_dir/bin/"
          cp discord_p2p_mesh.gdextension "$pkg_dir/"

      - uses: actions/upload-artifact@v4
        if: steps.sdk.outputs.available == 'true'
        with:
          name: windows-${{ matrix.target }}
          path: package/
